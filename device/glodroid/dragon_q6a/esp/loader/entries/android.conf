# Boot Loader Specification type#1 entry — Android 13 on Dragon Q6A (default)
#
# Universal HDMI cmdline: the kernel reads the connected display's EDID. For a
# display that provides an invalid or empty EDID, append
#   drm.edid_firmware=HDMI-A-1:edid/<name>.bin
# and place the blob on the ESP under Android/edid/.
#
# androidboot.boot_devices lists both the SD/eMMC controller (8804000.mmc) and the
# M.2 NVMe PCIe controller (1c08000.pcie), so one image boots from whichever medium
# holds the partitions. NVMe requires phy-qcom-qmp-pcie.ko in the first-stage
# ramdisk (after phy-qcom-qmp-combo.ko) so the PCIe pipe clock registers and the
# link trains before mount. The other PCIe port (1c00000) drives the onboard
# Realtek Gigabit Ethernet, not storage.
#
# rt_group_sched=0 disables RT group scheduling, which otherwise aborts Bluetooth.
#
# This entry runs with a quiet console: printing to the serial console is blocking
# and dominates boot time. The other entries keep full serial logging.
title      Android 13 — Dragon Q6A
linux      /Android/Image
initrd     /Android/ramdisk.img
devicetree /Android/qcs6490-radxa-dragon-q6a.dtb
options    initcall_blacklist=simpledrm_platform_driver_init console=tty0 fbcon=nodefer video=HDMI-A-1:e loglevel=3 modprobe.blacklist=msm panic=10 coherent_pool=2M firmware_class.path=/vendor/firmware aic_load_fw_usb.aic_fw_path=/metadata/aic8800_fw/USB/aic8800D80 irqchip.gicv3_pseudo_nmi=0 psi=1 selinux=1 androidboot.force_normal_boot=1 androidboot.slot_suffix=_a androidboot.hardware=dragon_q6a androidboot.selinux=permissive androidboot.boot_devices=soc@0/8804000.mmc,soc@0/1c08000.pcie lsm=landlock,lockdown,yama,integrity,selinux,bpf rt_group_sched=0
