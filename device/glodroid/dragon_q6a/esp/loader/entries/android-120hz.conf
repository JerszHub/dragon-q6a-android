# ⚠️ HARDWARE TEST RESULT 2026-08-24: with an adapter built around the
# MACROSILICON MS1861 (HDMI -> MIPI DSI with a scaler) this mode brings no
# visible gain. Measured: SurfaceFlinger reported 119.80 Hz, frame times of
# 8.35 ms (median), a game running at 119.8 FPS instead of 60.0 — so the
# PIPELINE genuinely ran at 120 Hz. But an A/B test (120 -> 60 -> 120 live, the
# switch confirmed in activeModeId) showed no visible difference at all.
# Conclusion: the bridge accepts a 120 Hz signal but drives the panel at its own
# fixed timing, duplicating frames. Since the MS1861 scales to the panel's
# native 1920x1080 anyway, feeding it 1280x768 only DEGRADES the picture with no
# smoothness gained.
#
# This entry is kept as a worked example of androidboot.hwc.force_mode — it is
# useful for displays attached WITHOUT such a scaling bridge (native DSI/DP).
#
# Boot Loader Specification type#1 entry — Android 13 on Dragon Q6A
# 120 Hz VARIANT — a trade: high refresh rate at the cost of resolution.
#
# Measured 2026-08-24 on a USB-C -> HDMI adapter (343c:0000, generic EDID
# "1920x1080 C", PnP ANW): at 1920x1080 the adapter offers ONLY 60 Hz. 120 Hz
# exists only lower down:
#     1280x768 @ 119.80 Hz   <- used here (highest resolution with 120 Hz)
#     1024x768 @ 119.99 Hz
#      800x600 @ 119.97 Hz
# To pick another one, change the value of androidboot.hwc.force_mode below.
#
# NOTE: the kernel parameter video=<conn>:WxH@R does NOT set the mode on this
# board (measured 2026-08-24: the command line was passed through, but the
# connector's mode list was unchanged, because drm_hwcomposer takes the mode
# flagged DRM_MODE_TYPE_PREFERRED). The mode is therefore requested through a
# property handled in HwcDisplay::ChoseForcedOrPreferredConfig().
#
# This is an ADAPTER limitation, not a board one: 1080p120 needs HDMI 2.0 class
# bandwidth, and cheap USB-C->HDMI adapters are usually HDMI 1.4b (4K30/1080p60).
# The QCS6490 DP controller handles up to 4K, so with an HDMI 2.0 adapter
# 1080p120 should appear on its own, with no change to this file.
#
# The "e" flag on video= is REQUIRED: hot-plug detection does not work on this
# board and the connector has to be forced on, or the screen stays black.
title      Android 13 — Dragon Q6A (1280x768 @ 120 Hz)
linux      /Android/Image
initrd     /Android/ramdisk.img
devicetree /Android/qcs6490-radxa-dragon-q6a.dtb
options    initcall_blacklist=simpledrm_platform_driver_init console=tty0 fbcon=nodefer video=HDMI-A-1:e androidboot.hwc.force_mode=1280x768@120 loglevel=3 modprobe.blacklist=msm panic=10 coherent_pool=2M firmware_class.path=/vendor/firmware aic_load_fw_usb.aic_fw_path=/metadata/aic8800_fw/USB/aic8800D80 irqchip.gicv3_pseudo_nmi=0 psi=1 selinux=1 androidboot.force_normal_boot=1 androidboot.slot_suffix=_a androidboot.hardware=dragon_q6a androidboot.selinux=permissive androidboot.boot_devices=soc@0/8804000.mmc,soc@0/1c08000.pcie lsm=landlock,lockdown,yama,integrity,selinux,bpf rt_group_sched=0
