# Boot Loader Specification type#1 entry — Android 13 on Dragon Q6A
# DIAGNOSTIC VARIANT of the 8HD panel: GT911 touch at the ALTERNATE I2C address.
#
# WHY: on 2026-08-24 a community member reported that the 8HD panel DOES light
# up on our release, but TOUCH DOES NOT WORK (a USB mouse on the same device
# works, so input in general is fine). We could not obtain logs from that
# hardware, so this is a shot in the dark — but a safe one, because it is a
# SEPARATE entry and leaves the working android-dsi8hd.conf untouched.
#
# HYPOTHESIS: the GT911 picks its I2C address from the INT pin level at reset —
# either 0x14 or 0x5D. Our device tree declares 0x14, and the mainline goodix
# driver does NOT probe the other address. If the panel board is wired for 0x5D,
# the probe fails with an I2C error and no input device is ever created.
# This entry uses a device tree in which ONLY the following changed:
#     touchscreen@14 -> touchscreen@5d,  reg = <0x14> -> reg = <0x5d>
# (verified: a `diff` of the decompiled device trees shows exactly those two
# lines and nothing else)
#
# HOW TO TEST: if touch works under this entry, the address was the cause.
# If it does not, the address is not the culprit and the next suspect is touch
# power — the driver logs "Failed to get AVDD28 regulator" / "VDDIO", and our
# device tree declares neither regulator.
#
# UART logging is enabled here (console=ttyMSM0 + loglevel=8), so with a serial
# adapter attached the driver's probe messages are visible.
title      Android 13 - Radxa DSI 8HD (touch at I2C 0x5D - diagnostic)
linux      /Android/Image
initrd     /Android/ramdisk.img
devicetree /Android/qcs6490-radxa-dragon-q6a-dsi8hd-alt.dtb
options    initcall_blacklist=simpledrm_platform_driver_init console=tty0 console=ttyMSM0,115200n8 earlycon=qcom_geni,0x00994000 fbcon=nodefer video=HDMI-A-1:e keep_bootcon ignore_loglevel loglevel=8 modprobe.blacklist=msm panic=10 coherent_pool=2M firmware_class.path=/vendor/firmware aic_load_fw_usb.aic_fw_path=/metadata/aic8800_fw/USB/aic8800D80 irqchip.gicv3_pseudo_nmi=0 psi=1 selinux=1 androidboot.force_normal_boot=1 androidboot.slot_suffix=_a androidboot.hardware=dragon_q6a androidboot.selinux=permissive androidboot.boot_devices=soc@0/8804000.mmc,soc@0/1c08000.pcie lsm=landlock,lockdown,yama,integrity,selinux,bpf rt_group_sched=0 printk.devkmsg=on
