# Boot Loader Specification type#1 entry — TWRP recovery on Dragon Q6A
#
# Same kernel and device tree as Android; only the ramdisk differs. The default
# entry's androidboot.force_normal_boot=1 is deliberately absent here, so
# first-stage init enters recovery (the ramdisk provides /system/bin/recovery).
#
# androidboot.dynamic_partitions=true sets ro.boot.dynamic_partitions, which the
# MindTheGapps update-binary reads: with it, find_block() resolves
# /dev/block/mapper/system_a (created by TWRP's CreateLogicalPartitions). Without
# it, find_block takes the non-dynamic branch and produces a bare relative name,
# the block test fails, and the package aborts with "Could not mount /mnt/system".
title      TWRP Recovery — Dragon Q6A
linux      /Android/Image
initrd     /TWRP/twrp_ramdisk.img
devicetree /Android/qcs6490-radxa-dragon-q6a.dtb
options    initcall_blacklist=simpledrm_platform_driver_init console=tty0 console=ttyMSM0,115200n8 earlycon=qcom_geni,0x00994000 fbcon=nodefer video=HDMI-A-1:e keep_bootcon ignore_loglevel loglevel=8 modprobe.blacklist=msm panic=10 coherent_pool=2M firmware_class.path=/vendor/firmware irqchip.gicv3_pseudo_nmi=0 psi=1 selinux=1 androidboot.slot_suffix=_a androidboot.hardware=dragon_q6a androidboot.selinux=permissive androidboot.boot_devices=soc@0/8804000.mmc,soc@0/1c08000.pcie lsm=landlock,lockdown,yama,integrity,selinux,bpf rt_group_sched=0 androidboot.dynamic_partitions=true printk.devkmsg=on
